<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactive Plasma Lava Lamp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000000;
            font-family: 'Arial', sans-serif;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 2000px;
            transform-style: preserve-3d;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
            animation: twinkle 3s ease-in-out infinite;
        }

        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 191, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 0, 128, 0.08) 0%, transparent 60%);
            filter: blur(100px);
            animation: nebulaShift 30s ease-in-out infinite;
        }

        .background-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.08) 0%, transparent 70%);
            filter: blur(80px);
            animation: pulse 4s ease-in-out infinite;
        }

        .floor {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 60%;
            background: linear-gradient(to top, rgba(10, 30, 50, 0.3) 0%, transparent 100%);
            transform: rotateX(80deg) translateZ(-500px);
            transform-style: preserve-3d;
        }

        .floor::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .pedestal {
            position: absolute;
            bottom: 20%;
            width: 320px;
            height: 50px;
            background: linear-gradient(to bottom, #1a5d6e 0%, #0a2f3d 50%, #051a24 100%);
            border-radius: 10px;
            box-shadow: 
                0 -8px 40px rgba(0, 255, 255, 0.4),
                0 15px 50px rgba(0, 0, 0, 0.9),
                inset 0 2px 10px rgba(0, 255, 255, 0.3),
                inset 0 -2px 10px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.1s ease;
            transform: translateZ(50px);
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .pedestal::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, rgba(0, 255, 255, 0.1) 40%, transparent 70%);
            border-radius: 50%;
            animation: pedestalGlow 2s ease-in-out infinite;
            filter: blur(20px);
        }

        .pedestal::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 10%;
            width: 80%;
            height: 15px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            border-radius: 50%;
            filter: blur(5px);
        }

        .sphere-container {
            position: relative;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
            transition: transform 0.05s ease-out;
            filter: drop-shadow(0 30px 60px rgba(139, 92, 246, 0.6));
        }

        .outer-sphere {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 30% 30%, rgba(0, 255, 255, 0.15) 0%, rgba(0, 180, 200, 0.08) 50%, transparent 70%);
            border: 2px solid rgba(0, 255, 255, 0.4);
            box-shadow: 
                inset 0 0 80px rgba(0, 255, 255, 0.3),
                inset -20px -20px 60px rgba(0, 0, 0, 0.3),
                0 0 100px rgba(0, 255, 255, 0.4),
                0 0 150px rgba(0, 255, 255, 0.2);
            animation: rotate 20s linear infinite;
            transition: all 0.05s ease-out;
            transform-style: preserve-3d;
        }

        .outer-sphere::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 30%;
            height: 30%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
            border-radius: 50%;
            filter: blur(15px);
        }

        .inner-sphere {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 35% 35%, #d8b4fe 0%, #a78bfa 25%, #6366f1 50%, #3b82f6 75%, #0ea5e9 100%);
            box-shadow: 
                inset 20px 20px 60px rgba(255, 255, 255, 0.4),
                inset -20px -20px 60px rgba(0, 0, 0, 0.4),
                0 0 120px rgba(139, 92, 246, 0.8),
                0 0 180px rgba(139, 92, 246, 0.4);
            overflow: hidden;
            transition: all 0.05s ease-out;
            transform-style: preserve-3d;
        }

        .inner-sphere::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 25%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
        }

        .plasma-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            opacity: 0.7;
            mix-blend-mode: screen;
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
            animation: sparkle 3s ease-in-out infinite;
        }

        .floating-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .floating-particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(100, 200, 255, 0.4) 50%, transparent 100%);
            box-shadow: 
                0 0 15px rgba(100, 200, 255, 0.8),
                0 0 30px rgba(100, 200, 255, 0.4);
            animation: floatAround 8s ease-in-out infinite;
        }

        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            height: 420px;
            border-radius: 50%;
            border: 1px solid rgba(0, 255, 255, 0.3);
            animation: ringPulse 3s ease-in-out infinite;
            transition: all 0.05s ease-out;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .candle-container {
            position: absolute;
            right: 15%;
            bottom: 25%;
            transform-style: preserve-3d;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.8));
        }

        .candle {
            position: relative;
            width: 35px;
            height: 120px;
            background: linear-gradient(to right, #3a2a20 0%, #5c4433 50%, #3a2a20 100%);
            border-radius: 8px 8px 3px 3px;
            box-shadow: 
                inset 3px 0 8px rgba(0, 0, 0, 0.6),
                inset -3px 0 8px rgba(0, 0, 0, 0.4),
                inset 0 -10px 20px rgba(0, 0, 0, 0.5);
            transform: translateZ(30px);
        }

        .candle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 5px;
            width: 8px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            border-radius: 8px 0 0 3px;
            filter: blur(2px);
        }

        .candle::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(to bottom, transparent 0%, transparent 20%, rgba(139, 69, 19, 0.3) 40%, rgba(160, 82, 45, 0.2) 60%, transparent 100%);
            border-radius: 8px 8px 3px 3px;
        }

        .candle-top {
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 10px;
            background: radial-gradient(ellipse, #4a3a2a 0%, #3a2a20 100%);
            border-radius: 50%;
            box-shadow: 
                inset 0 2px 5px rgba(0, 0, 0, 0.8),
                0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .wick {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 12px;
            background: linear-gradient(to bottom, #1a1a1a 0%, #4a4a4a 100%);
            border-radius: 1px;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
        }

        .flame {
            position: absolute;
            top: -38px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 40px;
            background: 
                radial-gradient(ellipse at center bottom, #ffeb3b 0%, #ffc107 20%, #ff9800 40%, #ff5722 60%, rgba(255, 87, 34, 0) 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(1px);
            animation: flicker 0.15s ease-in-out infinite;
            box-shadow: 
                0 0 20px #ffeb3b,
                0 0 40px #ff9800,
                0 0 60px rgba(255, 87, 34, 0.5);
        }

        .flame::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 24px;
            background: radial-gradient(ellipse at center, #fffacd 0%, #ffeb3b 30%, rgba(255, 235, 59, 0) 70%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(2px);
        }

        .flame::after {
            content: '';
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 14px;
            background: radial-gradient(ellipse at center, #ffffff 0%, #fffacd 40%, rgba(255, 250, 205, 0) 70%);
            border-radius: 50%;
            filter: blur(1px);
        }

        .flame-glow {
            position: absolute;
            top: -38px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255, 180, 0, 0.4) 0%, rgba(255, 100, 0, 0.2) 40%, transparent 70%);
            border-radius: 50%;
            animation: flameGlow 0.3s ease-in-out infinite;
            filter: blur(15px);
        }

        .wax-drip {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 25px;
            background: linear-gradient(to bottom, #5c4433 0%, rgba(92, 68, 51, 0) 100%);
            border-radius: 50% 50% 50% 50% / 20% 20% 80% 80%;
            opacity: 0.7;
        }

        .mic-button {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            background: rgba(0, 255, 255, 0.15);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 
                0 4px 20px rgba(0, 255, 255, 0.3),
                inset 0 1px 3px rgba(255, 255, 255, 0.2);
        }

        .mic-button:hover {
            background: rgba(0, 255, 255, 0.25);
            box-shadow: 
                0 6px 30px rgba(0, 255, 255, 0.5),
                inset 0 1px 3px rgba(255, 255, 255, 0.3);
            transform: translateX(-50%) translateY(-2px);
        }

        .mic-button.active {
            background: rgba(255, 0, 100, 0.25);
            border-color: rgba(255, 0, 100, 0.6);
            animation: micPulse 1s ease-in-out infinite;
            box-shadow: 
                0 6px 30px rgba(255, 0, 100, 0.5),
                inset 0 1px 3px rgba(255, 255, 255, 0.2);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateX(5deg); }
            50% { transform: translateY(-25px) rotateX(-5deg); }
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateZ(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.15); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes floatAround {
            0% { 
                transform: translate3d(0, 0, 0) scale(1);
                opacity: 0;
            }
            10% { opacity: 1; }
            50% { 
                transform: translate3d(var(--tx), var(--ty), var(--tz)) scale(1.5);
                opacity: 0.8;
            }
            90% { opacity: 1; }
            100% { 
                transform: translate3d(calc(var(--tx) * 2), calc(var(--ty) * 2), calc(var(--tz) * 2)) scale(0.5);
                opacity: 0;
            }
        }

        @keyframes ringPulse {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.05); }
        }

        @keyframes pedestalGlow {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes flicker {
            0%, 100% { 
                transform: translateX(-50%) scale(1, 1) translateY(0);
                filter: blur(1px);
            }
            25% { 
                transform: translateX(-50%) scale(0.95, 1.05) translateY(-2px);
                filter: blur(1.5px);
            }
            50% { 
                transform: translateX(-50%) scale(1.05, 0.95) translateY(1px);
                filter: blur(0.8px);
            }
            75% { 
                transform: translateX(-50%) scale(0.98, 1.02) translateY(-1px);
                filter: blur(1.2px);
            }
        }

        @keyframes flameGlow {
            0%, 100% { 
                opacity: 0.6;
                transform: translateX(-50%) scale(1);
            }
            50% { 
                opacity: 0.8;
                transform: translateX(-50%) scale(1.1);
            }
        }

        @keyframes twinkle {
            0%, 100% { 
                opacity: 0.2;
                transform: scale(1);
            }
            50% { 
                opacity: 0.7;
                transform: scale(1.3);
            }
        }

        @keyframes micPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }

        @keyframes nebulaShift {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="nebula"></div>
    
    <button class="mic-button" id="micButton">🎤 Enable Microphone</button>

    <div class="scene">
        <div class="floor"></div>
        <div class="background-glow"></div>
        
        <div class="floating-particles" id="floatingParticles"></div>
        
        <div class="sphere-container" id="sphereContainer">
            <div class="glow-ring" id="glowRing"></div>
            <div class="outer-sphere" id="outerSphere"></div>
            <div class="inner-sphere" id="innerSphere">
                <canvas class="plasma-layer" id="plasmaCanvas"></canvas>
                <div class="particles" id="particles"></div>
            </div>
        </div>
        
        <div class="pedestal" id="pedestal"></div>
        
        <div class="candle-container">
            <div class="candle">
                <div class="candle-top"></div>
                <div class="wick"></div>
                <div class="flame-glow"></div>
                <div class="flame"></div>
                <div class="wax-drip"></div>
            </div>
        </div>
    </div>

    <script>
        // Create ultra HD stars with depth
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 400; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.5 + 0.5;
            const depth = Math.random();
            star.style.width = size * (0.5 + depth) + 'px';
            star.style.height = size * (0.5 + depth) + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.opacity = depth * 0.7 + 0.3;
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = (4 + Math.random() * 6) + 's';
            starsContainer.appendChild(star);
        }

        // Create particles inside sphere
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 4 + 's';
            particle.style.animationDuration = (4 + Math.random() * 4) + 's';
            particlesContainer.appendChild(particle);
        }

        // Create floating particles outside sphere with 3D depth
        const floatingContainer = document.getElementById('floatingParticles');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'floating-particle';
            const size = Math.random() * 10 + 5;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            
            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            const tx = (Math.random() - 0.5) * 400;
            const ty = (Math.random() - 0.5) * 400;
            const tz = (Math.random() - 0.5) * 200;
            
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';
            particle.style.setProperty('--tx', tx + 'px');
            particle.style.setProperty('--ty', ty + 'px');
            particle.style.setProperty('--tz', tz + 'px');
            particle.style.animationDelay = Math.random() * 12 + 's';
            particle.style.animationDuration = (15 + Math.random() * 15) + 's';
            floatingContainer.appendChild(particle);
        }

        // High-resolution plasma effect
        const canvas = document.getElementById('plasmaCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 500;
        canvas.height = 500;

        let time = 0;
        let audioAmplitude = 0;

        function drawPlasma() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const maxRadius = canvas.width / 2;

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const dx = x - centerX;
                    const dy = y - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < maxRadius) {
                        const intensity = 1 + audioAmplitude * 2;
                        
                        const value1 = Math.sin(dist / (8 / intensity) + time * intensity);
                        const value2 = Math.sin((x + time * 60 * intensity) / 18);
                        const value3 = Math.sin((y + time * 40 * intensity) / 14);
                        const value4 = Math.sin((x + y + time * 50 * intensity) / 22);
                        
                        const plasma = (value1 + value2 + value3 + value4) / 4;
                        
                        const index = (y * canvas.width + x) * 4;
                        
                        data[index] = Math.floor(127 + 127 * Math.sin(plasma * Math.PI + time * 2 + audioAmplitude * 3));
                        data[index + 1] = Math.floor(127 + 127 * Math.sin(plasma * Math.PI + 2 + time + audioAmplitude * 2));
                        data[index + 2] = Math.floor(200 + 55 * Math.sin(plasma * Math.PI + 4 + time * 1.5 + audioAmplitude));
                        data[index + 3] = 200;
                    }
                }
            }

            ctx.putImageData(imageData, 0, 0);
            time += 0.02 + audioAmplitude * 0.05;
            requestAnimationFrame(drawPlasma);
        }

        drawPlasma();

        // Audio reactive functionality
        let audioContext;
        let analyser;
        let microphone;
        let dataArray;
        let isListening = false;

        const micButton = document.getElementById('micButton');
        const innerSphere = document.getElementById('innerSphere');
        const outerSphere = document.getElementById('outerSphere');
        const glowRing = document.getElementById('glowRing');
        const pedestal = document.getElementById('pedestal');
        const sphereContainer = document.getElementById('sphereContainer');

        micButton.addEventListener('click', async () => {
            if (!isListening) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    
                    analyser.fftSize = 256;
                    microphone.connect(analyser);
                    
                    const bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);
                    
                    isListening = true;
                    micButton.textContent = '🎤 Listening...';
                    micButton.classList.add('active');
                    
                    updateVisuals();
                } catch (err) {
                    console.error('Microphone access denied:', err);
                    alert('Please allow microphone access to use this feature!');
                }
            } else {
                if (microphone) {
                    microphone.disconnect();
                    audioContext.close();
                }
                isListening = false;
                micButton.textContent = '🎤 Enable Microphone';
                micButton.classList.remove('active');
                audioAmplitude = 0;
                resetVisuals();
            }
        });

        function updateVisuals() {
            if (!isListening) return;
            
            analyser.getByteFrequencyData(dataArray);
            
            const sum = dataArray.reduce((a, b) => a + b, 0);
            const average = sum / dataArray.length;
            audioAmplitude = average / 255;
            
            const scale = 1 + audioAmplitude * 0.6;
            const glowIntensity = 1 + audioAmplitude * 1.5;
            
            innerSphere.style.transform = `translate(-50%, -50%) scale(${scale})`;
            outerSphere.style.transform = `translate(-50%, -50%) scale(${scale * 0.95}) rotate(${Date.now() / 100}deg)`;
            glowRing.style.transform = `translate(-50%, -50%) scale(${scale * 1.05})`;
            
            innerSphere.style.boxShadow = `
                inset 20px 20px ${60 + audioAmplitude * 40}px rgba(255, 255, 255, ${0.4 + audioAmplitude * 0.3}),
                inset -20px -20px 60px rgba(0, 0, 0, 0.4),
                0 0 ${120 + audioAmplitude * 100}px rgba(139, 92, 246, ${0.8 + audioAmplitude * 0.2}),
                0 0 ${180 + audioAmplitude * 120}px rgba(139, 92, 246, ${0.4 + audioAmplitude * 0.4})
            `;
            
            outerSphere.style.boxShadow = `
                inset 0 0 ${80 + audioAmplitude * 60}px rgba(0, 255, 255, ${0.3 + audioAmplitude * 0.4}),
                inset -20px -20px 60px rgba(0, 0, 0, 0.3),
                0 0 ${100 + audioAmplitude * 80}px rgba(0, 255, 255, ${0.4 + audioAmplitude * 0.4}),
                0 0 ${150 + audioAmplitude * 100}px rgba(0, 255, 255, ${0.2 + audioAmplitude * 0.3})
            `;
            
            pedestal.style.boxShadow = `
                0 -8px ${40 + audioAmplitude * 40}px rgba(0, 255, 255, ${0.4 + audioAmplitude * 0.5}),
                0 15px 50px rgba(0, 0, 0, 0.9),
                inset 0 2px 10px rgba(0, 255, 255, 0.3),
                inset 0 -2px 10px rgba(0, 0, 0, 0.5)
            `;
            
            requestAnimationFrame(updateVisuals);
        }

        function resetVisuals() {
            innerSphere.style.transform = 'translate(-50%, -50%) scale(1)';
            outerSphere.style.transform = 'translate(-50%, -50%) scale(1)';
            glowRing.style.transform = 'translate(-50%, -50%) scale(1)';
            innerSphere.style.boxShadow = '';
            outerSphere.style.boxShadow = '';
            pedestal.style.boxShadow = '';
        }
    </script>
</body>
</html>
