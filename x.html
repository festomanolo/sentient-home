<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactive Plasma Lava Lamp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000000;
            font-family: 'Arial', sans-serif;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 2000px;
            transform-style: preserve-3d;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
            animation: twinkle 3s ease-in-out infinite;
        }

        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 191, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 0, 128, 0.08) 0%, transparent 60%);
            filter: blur(100px);
            animation: nebulaShift 30s ease-in-out infinite;
        }

        .background-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.08) 0%, transparent 70%);
            filter: blur(80px);
            animation: pulse 4s ease-in-out infinite;
        }

        .floor {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 60%;
            background: linear-gradient(to top, rgba(10, 30, 50, 0.3) 0%, transparent 100%);
            transform: rotateX(80deg) translateZ(-500px);
            transform-style: preserve-3d;
        }

        .floor::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .pedestal {
            position: absolute;
            bottom: 20%;
            width: 320px;
            height: 50px;
            background: linear-gradient(to bottom, #1a5d6e 0%, #0a2f3d 50%, #051a24 100%);
            border-radius: 10px;
            box-shadow: 
                0 -8px 40px rgba(0, 255, 255, 0.4),
                0 15px 50px rgba(0, 0, 0, 0.9),
                inset 0 2px 10px rgba(0, 255, 255, 0.3),
                inset 0 -2px 10px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.1s ease;
            transform: translateZ(50px);
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .pedestal::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, rgba(0, 255, 255, 0.1) 40%, transparent 70%);
            border-radius: 50%;
            animation: pedestalGlow 2s ease-in-out infinite;
            filter: blur(20px);
        }

        .pedestal::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 10%;
            width: 80%;
            height: 15px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            border-radius: 50%;
            filter: blur(5px);
        }
