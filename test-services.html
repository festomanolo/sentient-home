<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOX AI Services Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #333; border-radius: 8px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
        button { padding: 8px 16px; margin: 5px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2563eb; }
        #output { background: #111; padding: 10px; border-radius: 4px; margin-top: 10px; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>NOX AI Services Test</h1>
    
    <div class="test-section">
        <h2>Service Tests</h2>
        <button onclick="testWeather()">Test Weather Service</button>
        <button onclick="testVoice()">Test Voice Service</button>
        <button onclick="testSound()">Test Sound Detection</button>
        <button onclick="testWorldClock()">Test World Clock</button>
        <button onclick="testCalendar()">Test Calendar</button>
        <button onclick="testAppControl()">Test App Control</button>
        <button onclick="clearOutput()">Clear Output</button>
    </div>

    <div id="output"></div>

    <script type="module">
        function log(message, type = 'info') {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            output.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            output.scrollTop = output.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        // Test Weather Service
        window.testWeather = async () => {
            log('Testing Weather Service...', 'info');
            try {
                // Simulate weather service test
                const mockWeather = {
                    temperature: 72,
                    description: 'Partly cloudy',
                    location: 'San Francisco, CA',
                    humidity: 65,
                    windSpeed: 8
                };
                log(`Weather Service Test: ${JSON.stringify(mockWeather)}`, 'success');
                log('Weather service simulation successful', 'success');
            } catch (error) {
                log(`Weather Service Error: ${error.message}`, 'error');
            }
        };

        // Test Voice Service
        window.testVoice = async () => {
            log('Testing Voice Service...', 'info');
            try {
                if ('speechSynthesis' in window) {
                    log('Speech Synthesis API available', 'success');
                    const utterance = new SpeechSynthesisUtterance('Hello! NOX AI voice test successful.');
                    utterance.rate = 0.9;
                    utterance.pitch = 1.0;
                    speechSynthesis.speak(utterance);
                    log('Voice test spoken successfully', 'success');
                } else {
                    log('Speech Synthesis API not available', 'error');
                }

                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    log('Speech Recognition API available', 'success');
                } else {
                    log('Speech Recognition API not available', 'error');
                }
            } catch (error) {
                log(`Voice Service Error: ${error.message}`, 'error');
            }
        };

        // Test Sound Detection
        window.testSound = async () => {
            log('Testing Sound Detection...', 'info');
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    log('Media Devices API available', 'success');
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    log('Microphone access granted', 'success');
                    
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const analyser = audioContext.createAnalyser();
                    const microphone = audioContext.createMediaStreamSource(stream);
                    
                    analyser.fftSize = 256;
                    microphone.connect(analyser);
                    
                    log('Audio analysis setup successful', 'success');
                    
                    // Stop the stream after test
                    stream.getTracks().forEach(track => track.stop());
                    audioContext.close();
                    
                } else {
                    log('Media Devices API not available', 'error');
                }
            } catch (error) {
                log(`Sound Detection Error: ${error.message}`, 'error');
            }
        };

        // Test World Clock
        window.testWorldClock = () => {
            log('Testing World Clock Service...', 'info');
            try {
                const now = new Date();
                const timeZones = ['America/New_York', 'Europe/London', 'Asia/Tokyo'];
                
                timeZones.forEach(tz => {
                    const time = now.toLocaleString('en-US', { timeZone: tz });
                    log(`${tz}: ${time}`, 'success');
                });
                
                log('World Clock test successful', 'success');
            } catch (error) {
                log(`World Clock Error: ${error.message}`, 'error');
            }
        };

        // Test Calendar
        window.testCalendar = () => {
            log('Testing Calendar Service...', 'info');
            try {
                const mockEvents = [
                    {
                        title: 'Team Meeting',
                        startTime: new Date(Date.now() + 60 * 60 * 1000), // 1 hour from now
                        endTime: new Date(Date.now() + 2 * 60 * 60 * 1000), // 2 hours from now
                        description: 'Weekly team sync'
                    },
                    {
                        title: 'Lunch Break',
                        startTime: new Date(Date.now() + 4 * 60 * 60 * 1000), // 4 hours from now
                        endTime: new Date(Date.now() + 5 * 60 * 60 * 1000), // 5 hours from now
                        description: 'Lunch with colleagues'
                    }
                ];
                
                mockEvents.forEach(event => {
                    log(`Event: ${event.title} at ${event.startTime.toLocaleTimeString()}`, 'success');
                });
                
                log('Calendar service simulation successful', 'success');
            } catch (error) {
                log(`Calendar Error: ${error.message}`, 'error');
            }
        };

        // Test App Control
        window.testAppControl = () => {
            log('Testing App Control Service...', 'info');
            try {
                const mockApps = [
                    { name: 'Spotify', packageName: 'com.spotify.music', installed: true },
                    { name: 'YouTube', packageName: 'com.google.android.youtube', installed: true },
                    { name: 'Camera', packageName: 'com.android.camera', installed: true },
                    { name: 'Lark Player', packageName: 'com.lark.player', installed: false }
                ];
                
                mockApps.forEach(app => {
                    const status = app.installed ? 'Installed' : 'Not Installed';
                    log(`${app.name} (${app.packageName}): ${status}`, app.installed ? 'success' : 'info');
                });
                
                log('App Control service simulation successful', 'success');
            } catch (error) {
                log(`App Control Error: ${error.message}`, 'error');
            }
        };

        window.clearOutput = () => {
            document.getElementById('output').innerHTML = '';
        };

        // Auto-run basic tests on load
        log('NOX AI Services Test Page Loaded', 'info');
        log('Click buttons above to test individual services', 'info');
        
        // Test basic browser APIs
        setTimeout(() => {
            log('=== Browser API Availability Check ===', 'info');
            
            const apis = [
                { name: 'Speech Synthesis', available: 'speechSynthesis' in window },
                { name: 'Speech Recognition', available: 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window },
                { name: 'Media Devices', available: navigator.mediaDevices && navigator.mediaDevices.getUserMedia },
                { name: 'Geolocation', available: 'geolocation' in navigator },
                { name: 'Web Bluetooth', available: 'bluetooth' in navigator },
                { name: 'Local Storage', available: 'localStorage' in window },
                { name: 'Audio Context', available: 'AudioContext' in window || 'webkitAudioContext' in window }
            ];
            
            apis.forEach(api => {
                log(`${api.name}: ${api.available ? 'Available' : 'Not Available'}`, api.available ? 'success' : 'error');
            });
            
            log('=== API Check Complete ===', 'info');
        }, 1000);
    </script>
</body>
</html>
